name: Temporary isolated PostgreSQL QA input

on:
  pull_request:
    paths:
      - .github/workflows/saas37-local-database-input.yml

permissions:
  contents: read

jobs:
  database-tools:
    if: github.head_ref == 'test/saas37-scenario-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Package public database binaries only, without starting a database
        shell: bash
        run: |
          set -euo pipefail
          image=postgres:18.6
          docker pull --quiet "$image"
          digest="$(docker image inspect --format '{{.Id}}' "$image")"
          printf '%s\n' "$digest" > postgres-image-digest.txt
          docker run --rm --entrypoint bash "$digest" -c '
            set -euo pipefail
            {
              find /usr/lib/postgresql/18 /usr/share/postgresql/18 -type f
              ldd /usr/lib/postgresql/18/bin/* /usr/lib/postgresql/18/lib/*.so 2>/dev/null | awk '\''/=> \// { print $3 }'\''
            } | sort -u | sed '\''s@^/@@'\'' > /tmp/files
            tar --dereference -czf - -C / -T /tmp/files
          ' > postgres-qa-runtime.tar.gz
          sha256sum postgres-qa-runtime.tar.gz > postgres-qa-runtime.sha256
      - name: Retain public QA tools for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-postgres-qa-runtime
          path: |
            postgres-qa-runtime.tar.gz
            postgres-qa-runtime.sha256
            postgres-image-digest.txt
          retention-days: 1
          if-no-files-found: error
