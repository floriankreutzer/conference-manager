name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: semgrep-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'semgrep==1.179.0'
      - name: Verify pinned Semgrep version
        run: test "$(semgrep --version)" = "1.179.0"
      - name: Run repository-owned SAST rules
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config .semgrep.yml --error --metrics=off --disable-version-check src
