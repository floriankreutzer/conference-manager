name: OWASP ZAP Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dast.yml
      - .zap/**
      - scripts/validate-zap-report.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/dast.yml
      - .zap/**
      - scripts/validate-zap-report.mjs
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: static-launchpad
            target: https://floriankreutzer.github.io/conference-manager/
            readiness: https://floriankreutzer.github.io/conference-manager/
            exact_policy: .zap/static-launchpad.tsv
            summary_rules: .zap/static-launchpad-summary.tsv
          - surface: customer-demo
            target: https://conference-manager-demo.onrender.com/
            readiness: https://conference-manager-demo.onrender.com/api/v1/health/ready
            exact_policy: .zap/customer-demo.tsv
            summary_rules: .zap/customer-demo-summary.tsv
          - surface: platform-demo
            target: https://conference-manager-ops-demo.onrender.com/
            readiness: https://conference-manager-ops-demo.onrender.com/api/v1/platform/health/ready
            exact_policy: .zap/platform-demo.tsv
            summary_rules: .zap/platform-demo-summary.tsv
    steps:
      - name: Checkout reviewed DAST policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for public surface readiness
        env:
          DAST_READINESS_URL: ${{ matrix.readiness }}
        run: |
          set -euo pipefail

          for attempt in {1..24}; do
            status="$({
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 10 \
                "$DAST_READINESS_URL"
            } || true)"

            if [[ "$status" == '200' ]]; then
              exit 0
            fi

            if [[ "$attempt" == '24' ]]; then
              echo "::error::DAST surface did not become ready with a direct HTTP 200."
              exit 1
            fi

            sleep 5
          done

      - name: Prepare exact-alert verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f report_json.json zap.yaml
          echo "ZAP_SCAN_STARTED_AT_MS=$(date -u +%s%3N)" >> "$GITHUB_ENV"

      - name: ZAP baseline scan (${{ matrix.surface }})
        id: zap_scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.target }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-${{ matrix.surface }}
          # This only maps reviewed plugin/URL unions into zap-baseline.py's exit summary.
          # The always-run step below remains authoritative over the unfiltered raw report.
          cmd_options: '-a --auto -c ${{ matrix.summary_rules }}'

      - name: Verify exact alert references and reviewed risk
        if: always()
        env:
          ZAP_REPORT_PATH: report_json.json
          ZAP_POLICY_PATH: ${{ matrix.exact_policy }}
          ZAP_SUMMARY_POLICY_PATH: ${{ matrix.summary_rules }}
          ZAP_RISK_POLICY_PATH: .zap/reviewed-alert-risks.json
          ZAP_AUTOMATION_PLAN_PATH: zap.yaml
          ZAP_SURFACE: ${{ matrix.surface }}
          ZAP_TARGET: ${{ matrix.target }}
        run: node scripts/validate-zap-report.mjs
