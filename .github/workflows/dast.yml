name: OWASP ZAP Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dast.yml
      - .zap/**
      - scripts/generate-zap-plan.mjs
      - scripts/run-zap-baseline.sh
      - scripts/verify-zap-evidence-files.mjs
      - scripts/validate-zap-report.mjs
      - scripts/verify-hosted-demo-deployment.mjs
      - scripts/support/dast-operations-auth.mjs
      - tests/dast-operations-auth.test.js
      - tests/zap-evidence-files.test.js
      - .github/workflows/hosted-demo-acceptance.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/dast.yml
      - .zap/**
      - scripts/generate-zap-plan.mjs
      - scripts/run-zap-baseline.sh
      - scripts/verify-zap-evidence-files.mjs
      - scripts/validate-zap-report.mjs
      - scripts/verify-hosted-demo-deployment.mjs
      - scripts/support/dast-operations-auth.mjs
      - tests/dast-operations-auth.test.js
      - tests/zap-evidence-files.test.js
      - .github/workflows/hosted-demo-acceptance.yml
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

env:
  EXPECTED_FRONTEND_REF: ac0cd04281700636743e508335cd20c2325098a2
  EXPECTED_RUNTIME_REF: 38a14b0435fb92bfacea319c5414c1fc10aab9eb

concurrency:
  group: zap-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: static-launchpad
            target: https://floriankreutzer.github.io/conference-manager-website/en/demo/
            readiness: https://floriankreutzer.github.io/conference-manager-website/en/demo/
            exact_policy: .zap/static-launchpad.tsv
            summary_rules: .zap/static-launchpad-summary.tsv
          - surface: customer-demo
            target: https://conference-manager-demo.onrender.com/
            readiness: https://conference-manager-demo.onrender.com/api/v1/health/ready
            exact_policy: .zap/customer-demo.tsv
            summary_rules: .zap/customer-demo-summary.tsv
          - surface: platform-demo
            target: https://conference-manager-ops-demo.onrender.com/
            readiness: https://conference-manager-ops-demo.onrender.com/api/v1/platform/health/ready
            exact_policy: .zap/platform-demo.tsv
            summary_rules: .zap/platform-demo-summary.tsv
    steps:
      - name: Checkout reviewed DAST policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Wait for public surface readiness
        env:
          DAST_READINESS_URL: ${{ matrix.readiness }}
        run: |
          set -euo pipefail

          for attempt in {1..24}; do
            status="$({
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 10 \
                "$DAST_READINESS_URL"
            } || true)"

            if [[ "$status" == '200' ]]; then
              exit 0
            fi

            if [[ "$attempt" == '24' ]]; then
              echo "::error::DAST surface did not become ready with a direct HTTP 200."
              exit 1
            fi

            sleep 5
          done

      - name: Verify live candidate identity before DAST
        if: matrix.surface != 'static-launchpad'
        env:
          DAST_OPERATIONS_REQUIRED: '1'
          DAST_OPERATIONS_PASSWORD: ${{ secrets.DAST_OPERATIONS_PASSWORD }}
        run: node scripts/verify-hosted-demo-deployment.mjs

      - name: Prepare exact-alert verification
        env:
          ZAP_AUTOMATION_PLAN_PATH: zap-evidence/zap.yaml
          ZAP_SUMMARY_POLICY_PATH: ${{ matrix.summary_rules }}
          ZAP_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- zap-evidence
          install -d -m 0777 zap-evidence
          test ! -L zap-evidence
          expected_evidence_path="$(realpath -- "$GITHUB_WORKSPACE")/zap-evidence"
          actual_evidence_path="$(realpath -- zap-evidence)"
          test "$actual_evidence_path" = "$expected_evidence_path"
          echo "ZAP_SCAN_STARTED_AT_MS=$(date -u +%s%3N)" >> "$GITHUB_ENV"
          node scripts/generate-zap-plan.mjs
          install -m 0555 scripts/run-zap-baseline.sh zap-evidence/run-zap-baseline.sh
          touch \
            zap-evidence/addons.txt \
            zap-evidence/report_html.html \
            zap-evidence/report_json.json \
            zap-evidence/report_md.md
          chmod a+rw \
            zap-evidence/addons.txt \
            zap-evidence/report_html.html \
            zap-evidence/report_json.json \
            zap-evidence/report_md.md

      - name: Run uncapped ZAP passive baseline (${{ matrix.surface }})
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
          ZAP_TARGET: ${{ matrix.target }}
          DAST_OPERATIONS_PASSWORD: ${{ matrix.surface == 'platform-demo' && secrets.DAST_OPERATIONS_PASSWORD || '' }}
        run: |
          set -euo pipefail
          docker pull --quiet "$ZAP_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$ZAP_IMAGE")"
          test -n "$image_id"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/zap-evidence:/zap/wrk/:rw" \
            --network host \
            --env ZAP_TARGET \
            --env DAST_OPERATIONS_PASSWORD \
            "$image_id" \
            bash /zap/wrk/run-zap-baseline.sh

      - name: Verify live candidate identity after DAST
        if: ${{ always() && matrix.surface != 'static-launchpad' }}
        env:
          DAST_OPERATIONS_REQUIRED: '1'
          DAST_OPERATIONS_PASSWORD: ${{ secrets.DAST_OPERATIONS_PASSWORD }}
        run: node scripts/verify-hosted-demo-deployment.mjs

      - name: Verify link-free ZAP evidence files
        id: evidence_boundary
        if: always()
        env:
          DAST_OPERATIONS_PASSWORD: ${{ matrix.surface == 'platform-demo' && secrets.DAST_OPERATIONS_PASSWORD || '' }}
          DAST_OPERATIONS_REQUIRED: ${{ matrix.surface == 'platform-demo' && '1' || '0' }}
        run: node scripts/verify-zap-evidence-files.mjs

      - name: Verify exact alert references and reviewed risk
        if: ${{ always() && steps.evidence_boundary.outcome == 'success' }}
        env:
          ZAP_REPORT_PATH: zap-evidence/report_json.json
          ZAP_POLICY_PATH: ${{ matrix.exact_policy }}
          ZAP_SUMMARY_POLICY_PATH: ${{ matrix.summary_rules }}
          ZAP_RISK_POLICY_PATH: .zap/reviewed-alert-risks.json
          ZAP_AUTOMATION_PLAN_PATH: zap-evidence/zap.yaml
          ZAP_ADDON_MANIFEST_PATH: zap-evidence/addons.txt
          ZAP_SURFACE: ${{ matrix.surface }}
          ZAP_TARGET: ${{ matrix.target }}
        run: node scripts/validate-zap-report.mjs

      - name: Upload raw ZAP evidence (${{ matrix.surface }})
        if: ${{ always() && steps.evidence_boundary.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-${{ matrix.surface }}
          path: |
            zap-evidence/report_html.html
            zap-evidence/report_json.json
            zap-evidence/report_md.md
            zap-evidence/addons.txt
            zap-evidence/run-zap-baseline.sh
            zap-evidence/zap.yaml
          if-no-files-found: error
          retention-days: 30
