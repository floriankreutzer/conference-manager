name: Temporary locked Chromium QA input

on:
  pull_request:
    paths:
      - .github/workflows/saas37-local-browser-input.yml

permissions:
  contents: read

jobs:
  browser-tools:
    if: github.head_ref == 'test/saas37-scenario-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked test dependency and its Chromium engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          tar -czf playwright-chromium-qa.tar.gz -C "$HOME/.cache/ms-playwright" chromium_headless_shell-1243
          sha256sum playwright-chromium-qa.tar.gz > playwright-chromium-qa.sha256
      - name: Retain public browser binaries only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-chromium-qa-runtime
          path: |
            playwright-chromium-qa.tar.gz
            playwright-chromium-qa.sha256
          retention-days: 1
          if-no-files-found: error
