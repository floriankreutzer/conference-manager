name: CO-317 fixed failed H receipt inspection

# One-use read-only diagnosis. Never merge into H, F or main.
on:
  push:
    branches: [CO-317-h745-receipt-inspection]
    paths:
      - .github/workflows/co317-h745-receipt-inspection.yml
      - scripts/diagnostics/h745_receipt_reader.py
      - scripts/diagnostics/test_h745_receipt_reader.py

permissions:
  contents: read
  actions: read

concurrency:
  group: co317-h745-receipt-inspection
  cancel-in-progress: false

jobs:
  inspect-failed-receipts:
    if: github.repository == 'floriankreutzer/conference-manager' && github.ref == 'refs/heads/CO-317-h745-receipt-inspection' && github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout the exact reviewed diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked repository validation dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Require the complete repository baseline and dependency audit
        run: |
          npm run check
          npm run audit
      - name: Require original reader tests and strict receipt regression and progression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile scripts/diagnostics/h745_receipt_reader.py scripts/diagnostics/test_h745_receipt_reader.py
          python3 -m unittest discover -s scripts/diagnostics -p 'test_*.py' -v
      - name: Use standard Poppler only to read and raster the pinned original PDF
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/pdfinfo || ! test -x /usr/bin/pdftotext || ! test -x /usr/bin/pdftoppm; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y poppler-utils
          fi
          /usr/bin/pdftoppm -v
      - name: Read the fixed failed H artifact and transport its original PDF pages
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -u scripts/diagnostics/h745_receipt_reader.py
