name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit high-severity dependencies
        run: npm run audit
      - name: Run syntax, SAST, secret and regression checks
        run: npm run check
      - name: Install pinned Semgrep Community Edition
        run: python3 -m pip install --disable-pip-version-check --no-input 'semgrep==1.179.0'
      - name: Verify pinned Semgrep version
        env:
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: semgrep --version
      - name: Verify Semgrep rule coverage and fail-closed behavior
        run: python3 scripts/check-semgrep-policy.py
      - name: Run repository-owned Semgrep SAST policy
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          test "$(semgrep --version | head -n 1)" = "1.179.0"
          semgrep scan --config .semgrep.yml --oss-only --error --strict --disable-nosem --optimizations none --metrics=off --disable-version-check src


  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Change only the existing mirror priorities, never APT trust or suites.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify Guest print loading and recovery in both engines
        run: npx playwright test tests/e2e/production-application.spec.js --grep "EMP-14 EMP-15|EMP-15 unavailable|EMP-15 stalled"
      - name: Verify Tenant Admin keyboard lifecycle after navigation focus
        run: npx playwright test tests/e2e/tenant-role-administration.spec.js --grep "Tenant Admin lifecycle"
      - name: Verify Employee draft restoration after wizard navigation focus
        run: |
          npx playwright test tests/e2e/production-application.spec.js --grep "EMP-09: scoped session draft"
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser report and Guest PDF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  shared-demo-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 50
    env:
      DEMO_RATE_LIMIT_MAX: '1000'
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Require private API repository access
        env:
          SHARED_DEMO_API_READ_TOKEN: ${{ secrets.SHARED_DEMO_API_READ_TOKEN }}
        run: |
          if [[ -z "$SHARED_DEMO_API_READ_TOKEN" ]]; then
            echo "The read-only shared Demo API checkout credential is not configured." >&2
            exit 1
          fi
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: frontend
      - name: Checkout immutable API commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: floriankreutzer/conference-manager-api
          ref: bf9aeb03f3395a6efa64298d01b4e3637282fb0e
          token: ${{ secrets.SHARED_DEMO_API_READ_TOKEN }}
          persist-credentials: false
          path: api
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked API dependencies
        working-directory: api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Change only the existing mirror priorities, never APT trust or suites.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Add fixed Demo hosts
        run: echo "127.0.0.1 customer.demo.test platform.demo.test" | sudo tee -a /etc/hosts >/dev/null
      - name: Provision isolated Demo database roles
        working-directory: api
        run: node scripts/provision-shared-demo-ci.mjs
      - name: Apply canonical and Demo migrations
        working-directory: api
        run: |
          DATABASE_URL="$DEMO_MIGRATION_DATABASE_URL" DATABASE_SSL=disable npm run db:migrate
          npm run demo:db:migrate
          npm run demo:db:reset -- --confirm-seed-version=saas-3.7-three-demo-customers-v1
      - name: Start separate Customer and Platform Demo APIs
        working-directory: api
        run: |
          env \
            -u DEMO_PLATFORM_DATABASE_URL \
            -u DEMO_RESET_DATABASE_URL \
            -u DEMO_MIGRATION_DATABASE_URL \
            -u DEMO_PLATFORM_SESSION_SECRET \
            -u DEMO_PLATFORM_CSRF_SECRET \
            npm run start:demo:customer >customer-demo-api.log 2>&1 &
          echo $! >customer-demo-api.pid
          env \
            -u DEMO_CUSTOMER_DATABASE_URL \
            -u DEMO_MIGRATION_DATABASE_URL \
            -u DEMO_CUSTOMER_SESSION_SECRET \
            -u DEMO_CUSTOMER_CSRF_SECRET \
            npm run start:demo:platform >platform-demo-api.log 2>&1 &
          echo $! >platform-demo-api.pid
      - name: Wait for both Demo APIs to be ready
        working-directory: api
        run: |
          for attempt in {1..60}; do
            customer=0
            platform=0
            curl --fail --silent --show-error \
              -H "Host: customer.demo.test:4443" \
              http://127.0.0.1:3000/api/v1/health/ready >/dev/null && customer=1 || true
            curl --fail --silent --show-error \
              -H "Host: platform.demo.test:4443" \
              http://127.0.0.1:3100/api/v1/platform/health/ready >/dev/null && platform=1 || true
            if [[ "$customer" == 1 && "$platform" == 1 ]]; then exit 0; fi
            sleep 1
          done
          echo "The separate Demo API processes did not become ready." >&2
          exit 1
      - name: Run shared PostgreSQL browser journey once
        working-directory: frontend
        env:
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: npm run test:e2e:shared-demo
      - name: Verify manager worklist at actual 200 percent Chromium tab zoom
        working-directory: frontend
        env:
          CM_ACTUAL_BROWSER_ZOOM: '1'
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: xvfb-run -a npx playwright test tests/e2e-shared/manager-worklist-browser-zoom.spec.js --config=playwright.shared-demo.config.js --project=chromium-shared-demo --output=test-results-worklist-zoom
      - name: Upload actual manager browser zoom evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-worklist-browser-zoom-evidence
          path: frontend/test-results-worklist-zoom/
          if-no-files-found: ignore
          retention-days: 30
      - name: Run full three-customer progression and two-cycle reset acceptance
        working-directory: frontend
        env:
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: npm run test:e2e:saas37
      - name: Upload scenario evidence and bounded browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saas37-scenario-report
          path: frontend/playwright-report-saas37/
          if-no-files-found: error
          retention-days: 30
      - name: Stop Demo API processes
        if: always()
        run: |
          if [[ -f api/customer-demo-api.pid ]]; then kill "$(cat api/customer-demo-api.pid)" || true; fi
          if [[ -f api/platform-demo-api.pid ]]; then kill "$(cat api/platform-demo-api.pid)" || true; fi
      - name: Upload shared Demo browser report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-demo-playwright-report
          path: frontend/playwright-report-shared-demo/
          if-no-files-found: ignore
