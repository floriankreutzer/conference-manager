name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit high-severity dependencies
        run: npm run audit
      - name: Run syntax, SAST, secret and regression checks
        run: npm run check
      - name: Install pinned Semgrep Community Edition
        run: python3 -m pip install --disable-pip-version-check --no-input 'semgrep==1.179.0'
      - name: Verify pinned Semgrep version
        env:
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: semgrep --version
      - name: Verify Semgrep rule coverage and fail-closed behavior
        run: python3 scripts/check-semgrep-policy.py
      - name: Run repository-owned Semgrep SAST policy
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          test "$(semgrep --version | head -n 1)" = "1.179.0"
          semgrep scan --config .semgrep.yml --oss-only --error --strict --disable-nosem --optimizations none --metrics=off --disable-version-check src


  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Change only the existing mirror priorities, never APT trust or suites.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Install Chromium test CA trust utility
        run: sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Verify isolated acceptance transport in Chromium, WebKit and API requests
        run: node scripts/test-hosted-transport.mjs --browsers
      - name: Verify exact Microsoft action and native cookie custody before the full suite
        run: npx playwright test tests/e2e/platform-microsoft-operations.spec.js --project=${{ matrix.project }}
      - name: Verify explicit Owner customer navigation before the full suite
        run: npx playwright test tests/e2e/platform-owner-customer.spec.js tests/e2e/customer-owner-handoff.spec.js --project=${{ matrix.project }}
      - name: Verify Guest print loading and recovery in both engines
        run: npx playwright test tests/e2e/production-application.spec.js --grep "EMP-14 EMP-15|EMP-15 unavailable|EMP-15 stalled"
      - name: Verify Tenant Admin keyboard lifecycle after navigation focus
        run: npx playwright test tests/e2e/tenant-role-administration.spec.js --grep "Tenant Admin lifecycle"
      - name: Verify Employee draft restoration after wizard navigation focus
        run: |
          npx playwright test tests/e2e/production-application.spec.js --grep "EMP-09: scoped session draft"
      - name: Run complete browser suite for the selected engine
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload browser report and Guest PDF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore

  # Keep the existing required status, and fail it for any non-success matrix result.
  e2e:
    runs-on: ubuntu-latest
    needs: [browser-e2e, protected-browser-e2e]
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - name: Require both complete engine jobs to succeed
        env:
          BROWSER_MATRIX_RESULT: ${{ needs['browser-e2e'].result }}
          PROTECTED_BROWSER_MATRIX_RESULT: ${{ needs['protected-browser-e2e'].result }}
        run: test "$BROWSER_MATRIX_RESULT" = success && test "$PROTECTED_BROWSER_MATRIX_RESULT" = success

  shared-demo-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 50
    env:
      DEMO_RATE_LIMIT_MAX: '1000'
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: frontend
      - name: Checkout immutable API commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: floriankreutzer/conference-manager-api
          ref: 778e4cd81814075c651d836634809d934e3c81df
          token: ${{ secrets.SHARED_DEMO_API_READ_TOKEN || github.token }}
          persist-credentials: false
          path: api
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify private projection fixtures against immutable API
        run: |
          node frontend/scripts/check-product-delivery-contract.mjs api
          node frontend/scripts/check-provider-usage-contract.mjs api
          node frontend/scripts/check-live-metrics-contract.mjs api
          node frontend/scripts/check-operations-sources-contract.mjs api
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked API dependencies
        working-directory: api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Change only the existing mirror priorities, never APT trust or suites.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Add fixed Demo hosts
        run: echo "127.0.0.1 customer.demo.test platform.demo.test" | sudo tee -a /etc/hosts >/dev/null
      - name: Provision isolated Demo database roles
        working-directory: api
        run: node scripts/provision-shared-demo-ci.mjs
      - name: Apply canonical and Demo migrations
        working-directory: api
        run: |
          DATABASE_URL="$DEMO_MIGRATION_DATABASE_URL" DATABASE_SSL=disable npm run db:migrate
          npm run demo:db:migrate
          npm run demo:db:reset -- --confirm-seed-version=saas-3.7-three-demo-customers-v1
      - name: Start separate Customer and Platform Demo APIs
        working-directory: api
        run: |
          env \
            -u DEMO_PLATFORM_DATABASE_URL \
            -u DEMO_RESET_DATABASE_URL \
            -u DEMO_MIGRATION_DATABASE_URL \
            -u DEMO_PLATFORM_SESSION_SECRET \
            -u DEMO_PLATFORM_CSRF_SECRET \
            npm run start:demo:customer >customer-demo-api.log 2>&1 &
          echo $! >customer-demo-api.pid
          env \
            -u DEMO_CUSTOMER_DATABASE_URL \
            -u DEMO_MIGRATION_DATABASE_URL \
            -u DEMO_CUSTOMER_SESSION_SECRET \
            -u DEMO_CUSTOMER_CSRF_SECRET \
            npm run start:demo:platform >platform-demo-api.log 2>&1 &
          echo $! >platform-demo-api.pid
      - name: Wait for both Demo APIs to be ready
        working-directory: api
        run: |
          for attempt in {1..60}; do
            customer=0
            platform=0
            curl --fail --silent --show-error \
              -H "Host: customer.demo.test:4443" \
              http://127.0.0.1:3000/api/v1/health/ready >/dev/null && customer=1 || true
            curl --fail --silent --show-error \
              -H "Host: platform.demo.test:4443" \
              http://127.0.0.1:3100/api/v1/platform/health/ready >/dev/null && platform=1 || true
            if [[ "$customer" == 1 && "$platform" == 1 ]]; then exit 0; fi
            sleep 1
          done
          echo "The separate Demo API processes did not become ready." >&2
          exit 1
      - name: Run shared PostgreSQL browser journey once
        working-directory: frontend
        env:
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: npm run test:e2e:shared-demo
      - name: Verify manager worklist at actual 200 percent Chromium tab zoom
        working-directory: frontend
        env:
          CM_ACTUAL_BROWSER_ZOOM: '1'
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: xvfb-run -a npx playwright test tests/e2e-shared/manager-worklist-browser-zoom.spec.js --config=playwright.shared-demo.config.js --project=chromium-shared-demo --output=test-results-worklist-zoom
      - name: Upload actual manager browser zoom evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manager-worklist-browser-zoom-evidence
          path: frontend/test-results-worklist-zoom/
          if-no-files-found: ignore
          retention-days: 30
      - name: Run full three-customer progression and two-cycle reset acceptance
        working-directory: frontend
        env:
          DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
        run: npm run test:e2e:saas37
      - name: Upload scenario evidence and bounded browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas37-scenario-report
          path: frontend/playwright-report-saas37/
          if-no-files-found: error
          retention-days: 30
      - name: Stop Demo API processes
        if: always()
        run: |
          if [[ -f api/customer-demo-api.pid ]]; then kill "$(cat api/customer-demo-api.pid)" || true; fi
          if [[ -f api/platform-demo-api.pid ]]; then kill "$(cat api/platform-demo-api.pid)" || true; fi
      - name: Upload shared Demo browser report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-demo-playwright-report
          path: frontend/playwright-report-shared-demo/
          if-no-files-found: ignore

  protected-browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      PROTECTED_BROWSER_COUNTERPART_REF: 778e4cd81814075c651d836634809d934e3c81df
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact frontend candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: frontend
      - name: Checkout immutable protected API bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: floriankreutzer/conference-manager-api
          ref: 778e4cd81814075c651d836634809d934e3c81df
          token: ${{ secrets.SHARED_DEMO_API_READ_TOKEN || github.token }}
          persist-credentials: false
          path: api
      - name: Verify immutable counterpart and candidate refs
        run: |
          test "$(git -C api rev-parse HEAD)" = "$PROTECTED_BROWSER_COUNTERPART_REF"
          test "$(git -C frontend rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked API dependencies
        working-directory: api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual protected API passkey options reach native browser ports
        run: node frontend/scripts/check-platform-passkey-wire.mjs "$PWD/api"
      - name: Verify actual protected API insight reports reach both production views
        run: node frontend/scripts/check-platform-insight-wire.mjs "$PWD/api"
      - name: Verify actual Platform runtime projection reaches its strict frontend contract
        run: node frontend/scripts/check-platform-runtime-wire.mjs "$PWD/api"
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Change only the existing mirror priorities, never APT trust or suites.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install selected browser and normal test CA trust utility
        working-directory: frontend
        run: |
          npx playwright install --with-deps "${{ matrix.browser }}"
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Run actual different-site protected browser acceptance
        working-directory: frontend
        run: node scripts/test-protected-browser.mjs "${{ matrix.browser }}-protected"
