name: Portal Browser Zoom

on:
  pull_request:
    paths:
      - '.github/workflows/portal-browser-zoom.yml'
      - 'tests/e2e/demo-portal-browser-zoom.spec.js'
      - 'tests/e2e/fixtures/browser-zoom-extension/**'
      - 'demo-portal/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-browser-zoom.yml'
      - 'tests/e2e/demo-portal-browser-zoom.spec.js'
      - 'tests/e2e/fixtures/browser-zoom-extension/**'
      - 'demo-portal/**'

permissions:
  contents: read

jobs:
  actual-browser-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CM_ACTUAL_BROWSER_ZOOM: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and display dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify actual 200% Chromium tab zoom
        run: xvfb-run -a npx playwright test tests/e2e/demo-portal-browser-zoom.spec.js --project=chromium-desktop
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-browser-zoom-report
          path: playwright-report/
          if-no-files-found: ignore
