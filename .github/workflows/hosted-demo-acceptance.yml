name: Hosted Demo Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hosted-demo-acceptance.yml'
      - 'playwright.hosted-demo.config.js'
      - 'scripts/serve-hosted-demo-e2e.mjs'
      - 'scripts/read-hosted-demo-reset-evidence.mjs'
      - 'scripts/reset-hosted-demo-baseline.mjs'
      - 'scripts/verify-hosted-demo-deployment.mjs'
      - 'tests/hosted-demo-acceptance-support.test.js'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - 'docs/DEMO-RUNBOOK.md'

permissions:
  contents: read

concurrency:
  group: hosted-demo-acceptance
  cancel-in-progress: false

env:
  SHARED_DEMO_CUSTOMER_ORIGIN: https://conference-manager-demo.onrender.com
  SHARED_DEMO_PLATFORM_ORIGIN: https://conference-manager-ops-demo.onrender.com
  EXPECTED_FRONTEND_REF: 07f2896d56e6f66a9f8daf96457ab12c763adf80
  EXPECTED_RUNTIME_REF: 8cdfc4468a8cfb421ceb42b0393e700c17c6bfaa

jobs:
  hosted-demo-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for public Customer and Platform readiness
        shell: bash
        run: |
          set -euo pipefail
          wait_ready() {
            local name="$1"
            local url="$2"
            for attempt in {1..48}; do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [[ "$status" == '200' ]]; then
                echo "$name ready after attempt $attempt."
                return 0
              fi
              sleep 5
            done
            echo "$name did not become ready within the bounded cold-start window." >&2
            return 1
          }
          wait_ready 'Customer Demo' "$SHARED_DEMO_CUSTOMER_ORIGIN/api/v1/health/ready"
          wait_ready 'Platform Demo' "$SHARED_DEMO_PLATFORM_ORIGIN/api/v1/platform/health/ready"
      - name: Record hosted acceptance context
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "HOSTED_ACCEPTANCE_STARTED_AT=$started_at" >> "$GITHUB_ENV"
          {
            echo "customer_origin=$SHARED_DEMO_CUSTOMER_ORIGIN"
            echo "platform_origin=$SHARED_DEMO_PLATFORM_ORIGIN"
            echo "expected_frontend_ref=$EXPECTED_FRONTEND_REF"
            echo "expected_runtime_ref=$EXPECTED_RUNTIME_REF"
            echo "acceptance_source_ref=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "acceptance_started_at=$started_at"
          } > hosted-demo-evidence.txt
      - name: Verify live deployment identity
        run: node scripts/verify-hosted-demo-deployment.mjs >> hosted-demo-evidence.txt
      - name: Add fixed acceptance hosts
        run: echo "127.0.0.1 customer.demo.test platform.demo.test" | sudo tee -a /etc/hosts >/dev/null
      - name: Run hosted cross-role Demo journey
        id: hosted_journey
        continue-on-error: true
        run: npm run test:e2e:hosted-demo
      - name: Record bounded reset failure audit evidence
        if: always() && steps.hosted_journey.outcome == 'failure'
        run: node scripts/read-hosted-demo-reset-evidence.mjs >> hosted-demo-evidence.txt
      - name: Restore public Demo baseline after failed journey
        if: always() && steps.hosted_journey.outcome == 'failure'
        run: node scripts/reset-hosted-demo-baseline.mjs >> hosted-demo-evidence.txt
      - name: Upload hosted Demo evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-demo-acceptance-evidence
          path: hosted-demo-evidence.txt
          if-no-files-found: error
      - name: Upload hosted Demo browser report on journey failure
        if: always() && steps.hosted_journey.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-demo-playwright-report
          path: playwright-report-hosted-demo/
          if-no-files-found: ignore
      - name: Enforce hosted journey result
        if: always() && steps.hosted_journey.outcome == 'failure'
        run: exit 1
