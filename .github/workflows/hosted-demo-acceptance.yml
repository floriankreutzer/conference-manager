name: Hosted Demo Acceptance

on:
  # PR regression runs against isolated PostgreSQL; public acceptance is deliberate.
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance transport (gate requires the reviewed absolute deadline and two service tokens)
        required: true
        default: ordinary
        type: choice
        options: [ordinary, gate]
      expires_at:
        description: Existing shared gate expiry as canonical UTC ISO timestamp; never extended by this workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-demo-acceptance
  cancel-in-progress: false
  queue: max

env:
  SHARED_DEMO_CUSTOMER_ORIGIN: https://conference-manager-demo.onrender.com
  SHARED_DEMO_PLATFORM_ORIGIN: https://conference-manager-ops-demo.onrender.com
  EXPECTED_FRONTEND_REF: 5d5102b4f9842ec704ff26441ebe96719324ddb0
  EXPECTED_RUNTIME_REF: 566402fd098c298ff09ec3230ddd0b55d4ea91f6
  DEMO_SEED_VERSION: saas-3.7-three-demo-customers-v1
  DEMO_PROVIDER_HEALTH: healthy
  # Both browser suites plus rate windows and bounded independent cleanup.
  HOSTED_JOB_BUDGET_SECONDS: '4800'
  HOSTED_DESTRUCTIVE_RESERVE_SECONDS: '4200'
  HOSTED_READINESS_BUDGET_SECONDS: '360'

jobs:
  hosted-demo-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Record hosted job budget start
        shell: bash
        run: echo "HOSTED_JOB_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Validate acceptance mode
        env:
          ACCEPTANCE_MODE: ${{ inputs.mode }}
          ACCEPTANCE_REF: ${{ github.ref }}
        run: node -e "if (!['ordinary', 'gate'].includes(process.env.ACCEPTANCE_MODE) || (process.env.ACCEPTANCE_MODE === 'gate' && process.env.ACCEPTANCE_REF !== 'refs/heads/main')) process.exit(1)"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer the official Ubuntu archive for browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # The runner already trusts these mirrors. Change only their priority;
          # retain all source suites, signing keys and package verification.
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              original = path.read_text()
              azure = 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
              archive = 'https://archive.ubuntu.com/ubuntu/\tpriority:2'
              if original.count(azure) == 1 and original.count(archive) == 1:
                  updated = original.replace(azure, azure[:-1] + '2', 1)
                  updated = updated.replace(archive, archive[:-1] + '1', 1)
                  path.write_text(updated)
                  print('Using the existing official Ubuntu HTTPS mirror first.')
              else:
                  print('Runner mirror layout changed; retaining its trusted defaults.')
          PY
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run guarded hosted acceptance and independent cleanup
        if: inputs.mode == 'gate' && github.ref == 'refs/heads/main'
        env:
          CM_DEMO_ACCEPTANCE_MODE: gate
          CM_DEMO_ACCEPTANCE_EXPIRES_AT: ${{ inputs.expires_at }}
          CM_DEMO_CUSTOMER_ACCEPTANCE_TOKEN: ${{ secrets.CM_DEMO_CUSTOMER_ACCEPTANCE_TOKEN }}
          CM_DEMO_PLATFORM_ACCEPTANCE_TOKEN: ${{ secrets.CM_DEMO_PLATFORM_ACCEPTANCE_TOKEN }}
        run: node scripts/run-hosted-acceptance-journey.mjs
      - name: Wait for public Customer and Platform readiness
        if: inputs.mode != 'gate'
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date -u +%s) + HOSTED_READINESS_BUDGET_SECONDS ))
          attempt=0
          while (( $(date -u +%s) < deadline )); do
            attempt=$((attempt + 1))
            customer_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$SHARED_DEMO_CUSTOMER_ORIGIN/api/v1/health/ready" || true)"
            platform_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$SHARED_DEMO_PLATFORM_ORIGIN/api/v1/platform/health/ready" || true)"
            if [[ "$customer_status" == '200' && "$platform_status" == '200' ]]; then
              echo "Customer and Platform Demo ready after attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo "Customer and Platform Demo did not become ready within the bounded cold-start window." >&2
          exit 1
      - name: Record hosted acceptance context
        if: inputs.mode != 'gate'
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "HOSTED_ACCEPTANCE_STARTED_AT=$started_at" >> "$GITHUB_ENV"
          {
            echo "customer_origin=$SHARED_DEMO_CUSTOMER_ORIGIN"
            echo "platform_origin=$SHARED_DEMO_PLATFORM_ORIGIN"
            echo "expected_frontend_ref=$EXPECTED_FRONTEND_REF"
            echo "expected_runtime_ref=$EXPECTED_RUNTIME_REF"
            echo "acceptance_source_ref=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "acceptance_started_at=$started_at"
          } > hosted-demo-evidence.txt
      - name: Verify live deployment identity before journey
        if: inputs.mode != 'gate'
        id: pre_identity
        run: node scripts/verify-hosted-demo-deployment.mjs >> hosted-demo-evidence.txt
      - name: Require destructive cleanup reserve
        if: inputs.mode != 'gate'
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          elapsed=$(( now - HOSTED_JOB_STARTED_EPOCH ))
          latest_start=$(( HOSTED_JOB_BUDGET_SECONDS - HOSTED_DESTRUCTIVE_RESERVE_SECONDS ))
          if (( elapsed > latest_start )); then
            echo "Insufficient hosted job budget remains for the destructive journey and guaranteed cleanup." >&2
            exit 1
          fi
          echo "cleanup_reserve_seconds=$HOSTED_DESTRUCTIVE_RESERVE_SECONDS" >> hosted-demo-evidence.txt
      - name: Add fixed acceptance hosts
        if: inputs.mode != 'gate'
        run: echo "127.0.0.1 customer.demo.test platform.demo.test" | sudo tee -a /etc/hosts >/dev/null
      - name: Run hosted cross-role Demo journey
        if: inputs.mode != 'gate'
        id: hosted_journey
        continue-on-error: true
        run: npm run test:e2e:hosted-demo
      - name: Run full hosted three-customer and two-cycle scenario acceptance
        id: full_scenarios
        if: steps.hosted_journey.outcome == 'success' && inputs.mode != 'gate'
        continue-on-error: true
        run: npm run test:e2e:saas37
      - name: Record bounded reset failure audit evidence
        if: always() && steps.hosted_journey.outcome == 'failure' && inputs.mode != 'gate'
        run: node scripts/read-hosted-demo-reset-evidence.mjs >> hosted-demo-evidence.txt
      - name: Restore public Demo baseline after failed journey
        if: always() && (steps.hosted_journey.outcome == 'failure' || steps.full_scenarios.outcome == 'failure') && inputs.mode != 'gate'
        run: node scripts/reset-hosted-demo-baseline.mjs >> hosted-demo-evidence.txt
      - name: Verify canonical Demo baseline after successful journey
        if: steps.hosted_journey.outcome == 'success' && steps.full_scenarios.outcome == 'success' && inputs.mode != 'gate'
        run: node scripts/reset-hosted-demo-baseline.mjs >> hosted-demo-evidence.txt
      - name: Re-verify live deployment identity after journey and cleanup
        if: always() && steps.pre_identity.outcome == 'success' && steps.hosted_journey.outcome != 'skipped' && inputs.mode != 'gate'
        run: |
          node scripts/verify-hosted-demo-deployment.mjs >/dev/null
          echo "deployment_identity_stable=true" >> hosted-demo-evidence.txt
      - name: Upload hosted Demo evidence
        if: always() && inputs.mode != 'gate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-demo-acceptance-evidence
          path: hosted-demo-evidence.txt
          if-no-files-found: error
      - name: Upload hosted Demo browser report on journey failure
        if: always() && steps.hosted_journey.outcome == 'failure' && inputs.mode != 'gate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-demo-playwright-report
          path: playwright-report-hosted-demo/
          if-no-files-found: ignore
      - name: Upload full hosted scenario evidence and browser report
        if: always() && steps.full_scenarios.outcome != 'skipped' && steps.full_scenarios.outcome != '' && inputs.mode != 'gate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-saas37-scenario-evidence
          path: playwright-report-saas37/
          if-no-files-found: error
          retention-days: 30
      - name: Upload closed-schema guarded acceptance evidence
        if: always() && inputs.mode == 'gate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-gated-acceptance-evidence
          path: |
            acceptance-evidence-journey-*/summary.json
            acceptance-evidence-journey-*/journey-phases.json
            acceptance-evidence-journey-*/reset-audit.json
            acceptance-evidence-journey-*/acceptance-evidence-*/summary.json
            acceptance-evidence-journey-*/acceptance-evidence-*/scenario-*.json
            acceptance-evidence-journey-*/acceptance-evidence-*/reset-correlation.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce hosted journey result
        if: always() && (steps.hosted_journey.outcome == 'failure' || steps.full_scenarios.outcome == 'failure') && inputs.mode != 'gate'
        run: exit 1
