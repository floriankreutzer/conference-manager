}

h1 {
  font-weight: var(--font-weight-bold);
}

h2,
h3 {
  font-weight: var(--font-weight-medium);
}

button,''',
          )
          replace_once(
              'assets/styles.css',
              '''.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.72);
  font-weight: var(--font-weight-heavy);
  letter-spacing: -0.02em;
}''',
