name: Apply Manrope Typography Change

on:
  push:
    branches: [codex/manrope-display-typography]

permissions:
  contents: write

jobs:
  apply-typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/manrope-display-typography
      - name: Verify font provenance and vendor license metadata
        shell: bash
        run: |
          set -euo pipefail
          echo 'd0639be45d0af36e798172419d7bd173c4bd4f29e2b76cbb69db1d11bf8b0a40  assets/fonts/Manrope[wght].ttf' | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt' \
            --output assets/fonts/OFL.txt
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/FONTLOG.txt' \
            --output assets/fonts/FONTLOG.txt
      - name: Apply semantic typography changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'assets/tokens.css',
              ' */\n:root {',
              ''' */

@font-face {
  font-family: "Manrope";
  src: url("./fonts/Manrope%5Bwght%5D.ttf") format("truetype");
  font-style: normal;
  font-weight: 500 700;
  font-display: swap;
}

:root {''',
          )
          replace_once(
              'assets/tokens.css',
              '  --font-family-sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;',
              '  --font-family-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  --font-family-display: "Manrope", var(--font-family-sans);',
          )

          replace_once(
              'assets/styles.css',
              '''body {
  margin: 0;
  min-width: 320px;
  background: var(--color-canvas);
  color: var(--color-ink);
  font-family: var(--font-family-sans);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
}

button,''',
              '''body {
