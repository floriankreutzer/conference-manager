name: Apply Manrope Typography CSS

on:
  push:
    branches: [codex/manrope-display-typography]

permissions:
  contents: write

jobs:
  apply-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/manrope-display-typography
      - name: Verify font and vendor license metadata
        shell: bash
        run: |
          set -euo pipefail
          echo 'd0639be45d0af36e798172419d7bd173c4bd4f29e2b76cbb69db1d11bf8b0a40  assets/fonts/Manrope[wght].ttf' | sha256sum --check --strict
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt' --output assets/fonts/OFL.txt
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/FONTLOG.txt' --output assets/fonts/FONTLOG.txt
      - name: Apply scoped CSS changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once('assets/styles.css', 'body {\n  margin: 0;\n  min-width: 320px;\n  background: var(--color-canvas);\n  color: var(--color-ink);\n  font-family: var(--font-family-sans);\n  font-size: var(--font-size-base);\n  line-height: var(--line-height-base);\n}\n\nbutton,', 'body {\n  margin: 0;\n  min-width: 320px;\n  background: var(--color-canvas);\n  color: var(--color-ink);\n  font-family: var(--font-family-sans);\n  font-size: var(--font-size-base);\n  line-height: var(--line-height-base);\n}\n\nh1,\nh2,\nh3 {\n  font-family: var(--font-family-display);\n}\n\nh1 {\n  font-weight: var(--font-weight-bold);\n}\n\nh2,\nh3 {\n  font-weight: var(--font-weight-medium);\n}\n\nbutton,')
          replace_once('assets/styles.css', '.brand-mark {\n  display: grid;\n  width: 42px;\n  height: 42px;\n  place-items: center;\n  border: 1px solid rgba(255, 255, 255, 0.72);\n  font-weight: var(--font-weight-heavy);\n  letter-spacing: -0.02em;\n}', '.brand-mark {\n  display: grid;\n  width: 42px;\n  height: 42px;\n  place-items: center;\n  border: 1px solid rgba(255, 255, 255, 0.72);\n  font-family: var(--font-family-display);\n  font-weight: var(--font-weight-bold);\n  letter-spacing: -0.02em;\n}')
          replace_once('assets/styles.css', '.brand strong {\n  letter-spacing: -0.01em;\n}', '.brand strong {\n  font-family: var(--font-family-display);\n  font-weight: var(--font-weight-bold);\n  letter-spacing: -0.01em;\n}')
          replace_once('assets/styles.css', '.welcome-hero h2 {\n  max-width: 780px;\n  margin: 12px 0;\n  font-size: clamp(2rem, 3vw, 2.55rem);\n  line-height: 1.08;\n  letter-spacing: -0.03em;\n}', '.welcome-hero h2 {\n  max-width: 780px;\n  margin: 12px 0;\n  font-size: clamp(2rem, 3vw, 2.55rem);\n  line-height: 1.08;\n  font-weight: var(--font-weight-bold);\n  letter-spacing: -0.03em;\n}')
          replace_once('assets/styles.css', '.kpi strong {\n  display: block;\n  margin-top: 4px;\n  font-size: 1.75rem;\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n}', '.kpi strong {\n  display: block;\n  margin-top: 4px;\n  font-family: var(--font-family-display);\n  font-size: 1.75rem;\n  line-height: 1.1;\n  font-weight: var(--font-weight-bold);\n  letter-spacing: -0.02em;\n}')
          replace_once('assets/manager-layout.css', '.manager-first-use-content > strong {\n  display: block;\n  margin-bottom: var(--space-1);\n  font-size: var(--font-size-lg);\n}', '.manager-first-use-content > strong {\n  display: block;\n  margin-bottom: var(--space-1);\n  font-family: var(--font-family-display);\n  font-size: var(--font-size-lg);\n  font-weight: var(--font-weight-medium);\n}')
          replace_once('assets/feature-parity.css', '.manager-parity-kpi strong {\n  margin-top: 4px;\n  font-size: 1.55rem;\n  letter-spacing: -0.02em;\n}', '.manager-parity-kpi strong {\n  margin-top: 4px;\n  font-family: var(--font-family-display);\n  font-size: 1.55rem;\n  font-weight: var(--font-weight-bold);\n  letter-spacing: -0.02em;\n}')
          PY
          git diff --check
      - name: Commit scoped CSS and font metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/styles.css assets/manager-layout.css assets/feature-parity.css assets/fonts/OFL.txt assets/fonts/FONTLOG.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Manrope display typography surfaces'
          git push origin HEAD:codex/manrope-display-typography
